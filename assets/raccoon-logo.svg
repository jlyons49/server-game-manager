<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Cyber Glow -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="url(#neonGradient)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Raccoon Ears -->
  <polygon points="26,38 18,16 38,26" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="28,34 22,20 36,28" fill="#cbd5e1"/>
  
  <polygon points="74,38 82,16 62,26" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="72,34 78,20 64,28" fill="#cbd5e1"/>

  <!-- Head Base -->
  <ellipse cx="50" cy="52" rx="34" ry="28" fill="url(#furGradient)"/>

  <!-- White Cheek Tufts -->
  <path d="M 22,54 Q 14,58 20,66 Q 30,68 34,60 Z" fill="#e2e8f0"/>
  <path d="M 78,54 Q 86,58 80,66 Q 70,68 66,60 Z" fill="#e2e8f0"/>

  <!-- Classic Raccoon Bandit Mask -->
  <path d="M 24,46 Q 36,40 50,45 Q 64,40 76,46 Q 74,58 64,59 Q 50,54 36,59 Q 26,58 24,46 Z" fill="#090d16" stroke="#00f0ff" stroke-width="1" filter="url(#neonGlow)"/>

  <!-- Glowing Arcade Eyes / VR Visor Reflection -->
  <ellipse cx="38" cy="49" rx="5.5" ry="4" fill="#00f0ff"/>
  <ellipse cx="62" cy="49" rx="5.5" ry="4" fill="#00f0ff"/>
  <circle cx="39" cy="48" r="1.5" fill="#ffffff"/>
  <circle cx="63" cy="48" r="1.5" fill="#ffffff"/>

  <!-- Snout / Nose -->
  <path d="M 44,57 Q 50,54 56,57 Q 54,64 50,66 Q 46,64 44,57 Z" fill="#f8fafc"/>
  <polygon points="48,60 52,60 50,63" fill="#0f172a"/>
  
  <!-- Arcade Controller D-Pad Emblem on Forehead -->
  <path d="M 48,27 H 52 V 31 H 56 V 35 H 52 V 39 H 48 V 35 H 44 V 31 H 48 Z" fill="url(#neonGradient)"/>
</svg>
